<style>

*{box-sizing:border-box;margin:0;padding:0}

/* splash */

.numrow{display:flex;align-items:center;gap:10px;padding:10px 0}.numrow+.numrow{border-top:1px solid var(--ln)}.numrow b{font-size:20px;letter-spacing:.5px;flex:1}
#intro{position:fixed;inset:0;z-index:68;display:none;flex-direction:column;background:var(--bg);max-width:520px;margin:auto}
.itop{position:relative;flex:1;min-height:300px;background:linear-gradient(160deg,#1DB35C,#0E7A3B);border-radius:0 0 36px 36px;display:flex;align-items:center;justify-content:center;padding:56px 20px 20px;overflow:hidden}
.itop::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;border:26px solid rgba(255,255,255,.06);right:-120px;top:-120px}
.iart{width:100%;max-width:360px;animation:ifade .45s ease}@keyframes ifade{from{opacity:0;transform:translateY(12px)}}
.scn{width:100%;height:auto;display:block;overflow:visible}
.ilang{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;background:rgba(255,255,255,.14);border-radius:11px;padding:3px}.ilang button{border:0;background:none;color:#fff;font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px}.ilang button.on{background:#fff;color:#0E7A3B}
.iskip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:11px}
.ibot{padding:22px 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.ibot h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:14px 0 8px}.ibot p{color:var(--mu);font-size:15px;line-height:1.5;max-width:380px;margin:0 auto}
.idots{display:flex;gap:7px;justify-content:center}.idots i{width:8px;height:8px;border-radius:9px;background:var(--ln);transition:.25s;cursor:pointer}.idots i.on{width:26px;background:var(--g)}
.ikinds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}.ikinds span{display:inline-flex;align-items:center;gap:6px;background:var(--gl);color:var(--gt);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700}.ikinds svg{width:15px;height:15px}
.ibtns{display:flex;gap:10px;margin-top:22px}.ibtns .btn.g{width:56px;flex:none}
.scn .bag{animation:bag 6s infinite}.scn .vch{transform-box:fill-box;transform-origin:center;animation:vch 6s infinite}.scn .coin{animation:coin 6s infinite}.scn .plus{transform-box:fill-box;transform-origin:center;animation:plus 6s infinite}.scn .sk{transform-box:fill-box;transform-origin:bottom;animation:nod 6s infinite}.scn .cu{transform-box:fill-box;transform-origin:bottom;animation:nod2 6s infinite}
@keyframes bag{0%,8%{transform:translate(0,0);opacity:1}30%{transform:translate(118px,-6px);opacity:1}38%,100%{transform:translate(118px,-6px);opacity:0}}
@keyframes vch{0%,30%{transform:scale(0);opacity:0}38%{transform:scale(1.08);opacity:1}42%,70%{transform:scale(1);opacity:1}78%,100%{transform:scale(.8);opacity:0}}
@keyframes coin{0%,58%{transform:translate(0,0);opacity:0}62%{opacity:1;transform:translate(0,0)}72%{transform:translate(-90px,-46px)}84%{transform:translate(-172px,-10px);opacity:1}88%,100%{transform:translate(-172px,-10px);opacity:0}}
@keyframes plus{0%,84%{transform:scale(0);opacity:0}89%{transform:scale(1.1);opacity:1}97%{transform:scale(1);opacity:1}100%{opacity:0}}
@keyframes nod{0%,6%,14%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}86%{transform:rotate(0)}90%{transform:rotate(3deg)}94%{transform:rotate(0)}}
@keyframes nod2{0%,28%,36%,100%{transform:rotate(0)}32%{transform:rotate(4deg)}}
.scn .m1,.scn .m2,.scn .m3{transform-box:fill-box;transform-origin:left center}.scn .m1{animation:msg 6s infinite}.scn .m2{animation:msg 6s .9s infinite backwards}.scn .m3{animation:msg 6s 1.8s infinite backwards}
@keyframes msg{0%{opacity:0;transform:translateY(10px) scale(.9)}8%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
.scn .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s infinite}@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.scn .b1,.scn .b2,.scn .b3{transform-box:fill-box;transform-origin:bottom;animation:grow 5s infinite}.scn .b2{animation-delay:.25s}.scn .b3{animation-delay:.5s}
@keyframes grow{0%{transform:scaleY(0)}18%,85%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.scn .al{transform-box:fill-box;transform-origin:center;animation:ring 1.2s infinite}.scn .ct{animation:msg 5s infinite}
.scn .d1{offset-path:path("M84 160L140 96");animation:dot 2.4s linear infinite}.scn .d2{offset-path:path("M160 172V96");animation:dot 2.4s .8s linear infinite}.scn .d3{offset-path:path("M236 160L180 96");animation:dot 2.4s 1.6s linear infinite}
@keyframes dot{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.instb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:12px;font-weight:700;font-size:14px;margin-top:14px}.instb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ginst{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff}.iinst{background:var(--gl);border:0;color:var(--gt)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kinds button{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:11px;font-weight:700;font-size:13.5px;text-align:left}.kinds button.on{border-color:var(--g);background:var(--gl);color:var(--gt)}.kinds svg{width:20px;height:20px;flex:none}
@media (prefers-reduced-motion:reduce){.scn *{animation:none!important}}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;background:none;display:block;backdrop-filter:none}#sheet>div{max-width:none;border-radius:0;max-height:none;overflow:visible;background:#fff;color:#000;animation:none}.noprint,.grab,.shd{display:none!important}.vch{border:0}}

let camS=null;function stopCam(){if(camS){camS.getTracks().forEach(x=>x.stop());camS=null}}

function itemForm(i){i=i||{name:"",qty:"",price:"",cost:"",min:"",exp:"",bc:""};return shd(i.id?t("edit"):t("newi"))+`<label class="fl">${t("name")}</label><input id="a1" placeholder="${t("name")}" value="${h(i.name)}"><div class="sp"><div><label class="fl">${t("qty")}</label><input id="a2" type="number" inputmode="decimal" value="${i.qty}"></div><div><label class="fl">${t("min")}</label><input id="a4" type="number" inputmode="numeric" value="${i.min}"></div><div><label class="fl">${t("cost")}</label><input id="a7" type="number" step="0.01" inputmode="decimal" value="${i.cost||""}"></div><div><label class="fl">${t("price")}</label><input id="a3" type="number" step="0.01" inputmode="decimal" value="${i.price}"></div></div><label class="fl">${t("ed")}</label><input id="a5" type="date" value="${i.exp}"><label class="fl">${t("bc")}</label><input id="a6" value="${h(i.bc)}"><button class="btn w" onclick="saveI(${i.id||0})">${t("save")}</button>${i.id&&canDel()?`<button class="btn d w" style="margin-top:10px" onclick="if(confirm(t('delc'))){S.stock=S.stock.filter(x=>x.id!==${i.id});save();closeS();render()}">${t("del")}</button>`:""}`}

function saveI(id){const n=$("#a1").value.trim();if(!n)return toast(t("name"));const o={name:n,qty:+$("#a2").value||0,price:+$("#a3").value||0,min:+$("#a4").value||0,cost:+$("#a7").value||0,exp:$("#a5").value||iso(365),bc:$("#a6").value.trim()};if(id)Object.assign(S.stock.find(x=>x.id===id),o);else S.stock.push({id:uid(),sold:0,...o});save();closeS();render();toast(t("saved"))}
function restock(id){const i=S.stock.find(x=>x.id===id);openS(shd(`${t("restock")}: ${h(i.name)}`)+`<div class="mu" style="margin-bottom:10px">${t("instk")}: ${i.qty}</div><label class="fl">${t("addq")}</label><input id="rq" type="number" inputmode="numeric" value="1" min="1"><button class="btn w" onclick="doRestock(${id})">${t("save")}</button>`);setTimeout(()=>{const e=$("#rq");e&&e.select()},250)}
function doRestock(id){const i=S.stock.find(x=>x.id===id),n=+$("#rq").value||0;if(n<=0)return;i.qty+=n;save();closeS();render();toast(`${i.name}: ${i.qty}`)}
function sellS(id){const i=S.stock.find(x=>x.id===id),u="$('#st').textContent=m((+$('#sq').value||0)*(+$('#spr').value||0))";openS(shd(`${t("sell")}: ${h(i.name)}`)+`<div class="mu" style="margin-bottom:12px">${t("instk")}: ${i.qty} · ${m(i.price)}</div><div class="sp"><div><label class="fl">${t("qty")}</label><input id="sq" type="number" inputmode="decimal" value="1" min="1" max="${i.qty}" oninput="${u}"></div><div><label class="fl">${t("up")}</label><input id="spr" type="number" step="0.01" inputmode="decimal" value="${i.price}" oninput="${u}"></div></div><div class="tot"><b>${t("tot")}</b><b id="st" class="num">${m(i.price)}</b></div><button class="btn w" onclick="doSell(${id})">${t("cashsale")}</button><button class="btn o w" style="margin-top:10px" onclick="creditSell(${id})">${t("oncredit")}</button>`)}
function doSell(id){const i=S.stock.find(x=>x.id===id),q=Math.min(+$("#sq").value||0,i.qty),p=+$("#spr").value||0;if(q<=0)return;i.qty-=q;i.sold=(i.sold||0)+q;S.sales.push({id:uid(),a:r2(q*p),at:iso(0),n:i.name,q,sid:i.id,c:r2(q*(i.cost||0))});save();closeS();render();toast(`${t("sold")}: ${i.name} × ${q}`)}
function creditSell(id){const i=S.stock.find(x=>x.id===id),q=+$("#sq").value||1,p=+$("#spr").value||i.price;dt="c";openNew([{d:i.name,q,p}])}
function quickSell(){if(!S.stock.length)return toast(t("none"));openS(shd(t("qa_sell"))+S.stock.map(i=>`<div class="card li" style="cursor:pointer;margin-bottom:8px;padding:12px" onclick="sellS(${i.id})"><div class="av" style="background:var(--gl);color:var(--gt)">${sv("box")}</div><div class="mid"><b>${h(i.name)}</b><span class="mu">${m(i.price)}</span></div><div class="end"><b class="num">${i.qty}</b><div class="mu">${t("instk")}</div></div></div>`).join(""))}

async function scan(){if("BarcodeDetector" in window&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});openS(shd(t("scan"))+`<p class="mu" style="margin-bottom:10px">${t("scanning")}</p><video id="cam" playsinline muted></video><button class="btn g w" onclick="closeS();manualScan()">${t("manual")}</button>`);camS=st;const v=$("#cam");v.srcObject=st;await v.play();const det=new BarcodeDetector();const loop=async()=>{if(!camS)return;try{const r=await det.detect(v);if(r.length){closeS();onCode(r[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop();return}catch(e){stopCam()}}manualScan()}

function saveD(){const it=dr.filter(r=>r.d.trim()&&r.q*r.p>0).map(r=>({d:r.d.trim(),q:r.q,p:r.p}));if(!dn.trim()||!it.length)return toast(t("name")+" + "+t("desc"));const amount=r2(it.reduce((a,r)=>a+r.q*r.p,0));

save();tab="debt";dv="v";render();view(id);toast(t("saved"))}

/* sync engine: diff local state against last-known snapshot, push changes, pull newer rows */
const MK=()=>"dd3m:"+CUR.id;
function loadMeta(){META=lsj(MK(),null)||{cur:0,snap:{},pend:{}}}
function saveMeta(){lss(MK(),META)}
function diff(){if(!META)return 0;const now=Date.now(),seen={};let n=0;
for(const k in KINDS)for(const r of KINDS[k]()){const key=k+":"+r.id,hs=fnv(cj(r));seen[key]=1;if(META.snap[key]!==hs){META.snap[key]=hs;META.pend[key]={kind:k,id:String(r.id),data:r,u:now,deleted:false};n++}}
for(const key in META.snap)if(!seen[key]){const i=key.indexOf(":");META.pend[key]={kind:key.slice(0,i),id:key.slice(i+1),data:{},u:now,deleted:true};delete META.snap[key];n++}
if(n)saveMeta();return n}
const pendN=()=>META?Object.keys(META.pend).length:0;
function putRec(arr,id,obj){const i=arr.findIndex(x=>String(x.id)===id);if(i>=0)arr[i]=obj;else arr.push(obj)}
function mergeDebt(loc,rem,locNewer){const base=locNewer?loc:rem,P=new Map();[...(rem.pays||[]),...(loc.pays||[])].forEach(p=>P.set(String(p.i||p.at+p.a+p.m),p));const pays=[...P.values()].sort((a,b)=>(a.at||"").localeCompare(b.at||""));return Object.assign({},base,{pays,paid:r2(pays.reduce((a,p)=>a+(+p.a||0),0))})}
async function push(){const keys=Object.keys(META.pend);for(let i=0;i<keys.length;i+=200){const ks=keys.slice(i,i+200),rows=ks.map(k=>META.pend[k]);
const {data,error}=await sb.rpc("sync_push",{p_shop:CUR.id,p_rows:rows});if(error)throw error;ks.forEach((k,j)=>{if(META.pend[k]&&META.pend[k].u===rows[j].u)delete META.pend[k]});saveMeta()}}
async function pull(){let ch=false;for(;;){const {data,error}=await sb.rpc("sync_pull",{p_shop:CUR.id,p_since:META.cur,p_limit:1000});if(error)throw error;const rows=data||[];
for(const r of rows){META.cur=Math.max(META.cur,+r.seq);const getA=KINDS[r.kind];if(!getA)continue;const arr=getA(),key=r.kind+":"+r.id,p=META.pend[key];
if(p){if(r.kind==="debt"&&!p.deleted&&!r.deleted){const mg=mergeDebt(p.data,r.data,p.u>=+r.u);putRec(arr,r.id,mg);META.snap[key]=fnv(cj(mg));META.pend[key]={...p,data:mg,u:Math.max(Date.now(),+r.u+1)};ch=true;continue}
if(+r.u>p.u)delete META.pend[key];else continue}
if(r.deleted){const i=arr.findIndex(x=>String(x.id)===r.id);if(i>=0){arr.splice(i,1);ch=true}delete META.snap[key]}
else{const hs=fnv(cj(r.data));if(META.snap[key]!==hs||!arr.some(x=>String(x.id)===r.id)){putRec(arr,r.id,r.data);META.snap[key]=hs;ch=true}}}
saveMeta();if(rows.length<1000)break}
if(ch){migrate();diff();try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}return ch}

try{diff();await refreshShop();if(!CUR)return;syncLogo();const ch=await pull();if(CUR.active&&pendN())await push();setSync(pendN()&&!CUR.active?"locked":"ok");if(ch)render()}
catch(e){const x=String(e&&e.message||e);setSync(/fetch|network|load failed/i.test(x)||!navigator.onLine?"off":"err");if(x.includes("subscription_inactive"))setSync("locked");console.warn("sync",x)}
finally{syncing=false;if(again){again=false;queueSync()}}}

<label class="fl">${t("sender")}</label><input id="psd" type="tel" inputmode="tel" placeholder="063…" value="${h((window._psd)||"")}" oninput="window._psd=this.value"><label class="fl">${t("txref")}</label><input id="prf" placeholder="Tix…" value="${h((window._prf)||"")}" oninput="window._prf=this.value"><button class="btn w" id="pb" onclick="sendPay()">${t("sendpay")}</button>`:`<div class="ans">${CUR.suspended?t("suspmsg"):t("askowner")}</div>`}
${HIST.length?`<div class="sec"><h3>${t("hist")}</h3></div><div class="card">${HIST.map(p=>`<div class="row lrow"><span><b>${perLbl(p.months)} · ${m(p.amount)}</b><div class="mu">${fdt(p.created_at)} · ${h(p.method)} · ${h(p.ref)}</div>${p.note?`<div class="mu">${h(p.note)}</div>`:""}</span><span class="tag ${p.status==="approved"?"k":p.status==="rejected"?"r":"a"}">${t("st_"+p.status)}</span></div>`).join("")}</div>`:""}`)}
function cp(v){(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(t("copied")+": "+v)).catch(()=>toast(v))}
async function sendPay(){const PL=(CONF&&CONF.plans)||[],pl=PL[selP]||PL[0];if(!pl)return;const sd=$("#psd").value.trim(),rf=$("#prf").value.trim();if(!sd&&!rf)return toast(t("e_ref"));$("#pb").disabled=true;
try{const {error}=await sb.rpc("submit_payment",{p_shop:CUR.id,p_months:pl.months,p_method:payM,p_sender:sd,p_ref:rf});if(error)throw error;window._psd=window._prf="";toast(t("paysent"));await refreshShop();render();subS()}catch(e){toast(errT(e));$("#pb").disabled=false}}

/* team */
async function loadTeam(){const el=$("#tm");if(!el)return;try{const {data,error}=await sb.rpc("shop_members",{p_shop:CUR.id});if(error)throw error;if(!$("#tm"))return;
$("#tm").innerHTML=(data||[]).map(u=>{const me=ME&&u.user_id===ME.id,can=!u.pending?(u.role!=="owner"&&!me&&(CUR.role==="owner"||u.role==="cash")):true;return `<div class="row lrow"><div class="li" style="min-width:0">${AV(u.name||u.email)}<div class="mid"><b>${h(u.name||u.email.split("@")[0])}${me?` · ${t("you")}`:""}</b><span class="mu" style="display:block;overflow:hidden;text-overflow:ellipsis">${h(u.email)}</span></div></div><span style="display:flex;gap:6px;align-items:center;flex:none">${u.pending?`<span class="tag a">${t("waiting")}</span>`:""}<span class="tag k">${t(u.role)}</span>${can?`<button class="btn d s" onclick="removeM('${h(u.email)}')">✕</button>`:""}</span></div>`}).join("")}catch(e){if($("#tm"))$("#tm").innerHTML=`<div class="mu">${h(errT(e))}</div>`}}
async function invite(){const e=$("#ie").value.trim(),n=$("#in").value.trim(),r=$("#ir").value;if(!e)return toast(t("email"));try{const {data,error}=await sb.rpc("invite_member",{p_shop:CUR.id,p_email:e,p_role:r,p_name:n});if(error)throw error;toast(t(data==="added"?"added":"invited"));$("#ie").value="";$("#in").value="";loadTeam()}catch(x){toast(errT(x))}}
async function removeM(e){if(!confirm(t("delc")))return;try{const {error}=await sb.rpc("remove_member",{p_shop:CUR.id,p_email:e});if(error)throw error;loadTeam()}catch(x){toast(errT(x))}}

/* boot */
async function boot(){if(!lsj("dd3:intro",0)){setTimeout(()=>{const s2=$("#splash");if(s2)s2.remove()},0);await showIntro()}if(!CLOUD){render();if(S.pin)lockScreen();return}
const pf=lsj("dd3:prefs",null);if(pf)Object.assign(S,pf);applyTheme();
loadingScreen();if(!window.supabase)await new Promise(res=>{const x=document.createElement("script");x.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";x.onload=x.onerror=res;document.head.appendChild(x);setTimeout(res,25000)});
if(!window.supabase){gNow=()=>location.reload();return gate(`<div class="gcard"><div class="gmsg">${t("offline1")}</div><button class="btn w" onclick="location.reload()">${t("retry")}</button></div>`)}
sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")newPwScreen()});
if(/type=recovery/.test(location.hash))recovering=true;
let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
if(recovering)return newPwScreen();ses?afterLogin(ses):authScreen();
addEventListener("online",()=>sync());document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});setInterval(()=>{if(!document.hidden)sync()},45000)}
["openNew","editD","delD","payS","doPay","quickPay","sellS","doSell","creditSell","quickSell","expS","saveE","restock","doRestock","saveI","saveD","editI","restore","resetData"].forEach(n=>{const f=window[n];if(typeof f!=="function")return;window[n]=function(){if(!canWrite()){closeS();return lockedS()}return f.apply(this,arguments)}});

$("#spt").textContent=t("tag");boot();setTimeout(()=>{const x=$("#splash");if(!x)return;x.style.opacity=0;setTimeout(()=>x.remove(),450)},1200);
