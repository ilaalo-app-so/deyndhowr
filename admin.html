<!DOCTYPE html>
<html lang="so"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7A3B">
<meta name="robots" content="noindex">
<title>DeynDhowr Admin</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#18A352;--gd:#0E7A3B;--gl:#E7F6EC;--gt:#0E7A3B;--bg:#F3F6F4;--card:#fff;--tx:#0D1F16;--mu:#66786D;--ln:#E3EAE5;--red:#D8473B;--redl:#FDECEA;--amb:#B36A00;--ambl:#FFF3DC;--blu:#2453B3;--blul:#E8F0FE;--sh:0 1px 2px rgba(13,31,22,.04),0 6px 20px rgba(13,31,22,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1410;--card:#14201A;--tx:#E9F3EE;--mu:#8FA99B;--ln:#22332A;--gl:#16301F;--gt:#5FD38E;--redl:#3A1E1B;--ambl:#3A2D14;--blul:#18243F;--blu:#8DB0FF;--sh:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14.5px/1.45 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
header{background:linear-gradient(150deg,#1DB35C,#0E7A3B);color:#fff;padding:18px 20px 70px}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center}.logo img{width:32px}
.top h1{font-size:18px;font-weight:800}.top small{display:block;opacity:.85;font-size:12.5px}
.top .sp{flex:1}
.hb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700}
main{max-width:1080px;margin:-50px auto 40px;padding:0 16px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}.kpi span{color:var(--mu);font-size:12.5px;font-weight:600}
.kpi.p{background:linear-gradient(150deg,#1DB35C,#0E7A3B);color:#fff;border:0}.kpi.p span{color:rgba(255,255,255,.85)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:5px;margin-bottom:14px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:700;color:var(--mu);white-space:nowrap}.tabs button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card h2{font-size:16px;font-weight:800;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle;font-size:13.5px}th{color:var(--mu);font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block}
.tag.k{background:var(--gl);color:var(--gt)}.tag.r{background:var(--redl);color:var(--red)}.tag.a{background:var(--ambl);color:var(--amb)}.tag.b{background:var(--blul);color:var(--blu)}
.btn{background:var(--g);color:#fff;border:0;border-radius:11px;padding:8px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.o{background:var(--gl);color:var(--gt)}.btn.d{background:var(--redl);color:var(--red)}.btn.g{background:transparent;border:1.5px solid var(--ln);color:var(--tx)}
.btn.lg{padding:12px 16px;font-size:14.5px;width:100%;border-radius:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}input:focus{outline:0;border-color:var(--g)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:0 3px 5px}
.mu{color:var(--mu);font-size:12.5px}
.srch{max-width:320px;margin-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}.plan input{margin-bottom:8px}
.empty{text-align:center;color:var(--mu);padding:30px}
.login{max-width:400px;margin:-30px auto 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.mcards{display:none}
@media (max-width:820px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}table.rt{display:none}.mcards{display:block}.mc{border-bottom:1px solid var(--ln);padding:12px 0}.mc:last-child{border:0}.srch{max-width:none}}
.use{margin-bottom:14px}.meter{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;border-radius:9px}.warn{margin-top:10px;font-weight:700;font-size:13.5px}
</style></head><body>

<main id="app"></main><div id="toast"></div>
<script>
const CFG=window.DD_CONFIG||{},$=s=>document.querySelector(s);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=n=>"$"+(Math.round((+n||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const KN={shop:"Dukaan",whole:"Bakhaar",pharm:"Dawo iibiye",other:"Kale"};
const MON=["Jan","Feb","Mar","Abr","Maj","Jun","Luu","Ogo","Seb","Okt","Nof","Dis"];
const fd=x=>{if(!x)return "—";const d=new Date(x);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const dleft=x=>Math.ceil((new Date(x)-Date.now())/864e5);
function toast(x){const e=$("#toast");e.textContent=x;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}
let sb,SH=[],PAY=[],ALLPAY=[],CONF={},tab="pay",q="",fl="all",USE=null,TR=null,tq="",ER=null,TK=null,tkf="open",SID=null,SD=null,SR=null,sk="debt",sq2="",HV=null;
if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){$("#app").innerHTML=`<div class="card login"><h2>Habayn ayaa maqan</h2><p class="mu">Fur faylka <b>config.js</b> oo geli SUPABASE_URL iyo SUPABASE_ANON_KEY. Hubi sidoo kale in internet-ku shaqaynayo.</p></div>`}
else{sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);sb.auth.getSession().then(r=>r.data.session?start():loginV())}
function loginV(msg){$("#rb").style.display=$("#ob").style.display="none";$("#app").innerHTML=`<div class="card login"><h2>Gal (admin)</h2>${msg?`<p style="color:var(--red);margin-bottom:10px">${h(msg)}</p>`:""}<label>Email</label><input id="e" type="email" autocomplete="email"><label>Password</label><input id="p" type="password" onkeydown="if(event.key==='Enter')login()"><button class="btn lg" onclick="login()">Gal</button></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});if(error)return loginV(error.message.includes("Invalid")?"Email-ka ama password-ku waa khalad.":error.message);start()}
async function out(){await sb.auth.signOut();loginV()}
async function start(){const {data,error}=await sb.rpc("is_admin");if(error||!data){const u=(await sb.auth.getUser()).data.user;return $("#app").innerHTML=`<div class="card login"><h2>Ma tihid admin</h2><p class="mu" style="margin-bottom:12px">${h(u&&u.email)} looma oggola boggan. Ku dar admins-ka (eeg hagaha SETUP).</p><button class="btn g" onclick="out()">Ka bax</button></div>`}
const u=(await sb.auth.getUser()).data.user;$("#who").textContent=u.email;$("#rb").style.display=$("#ob").style.display="";load()}

<div class="mcards">${L.map(s=>`<div class="mc"><div class="row"><b>${h(s.name)}</b>${st(s)}</div><div class="mu" style="margin:4px 0 8px">${KN[s.kind]||""} · ${h(s.owner_email||"")} · dhamaad ${fd(ends(s))} · ${s.members} xubin · ${s.records} xog</div>${act(s)}</div>`).join("")}</div>`:`<div class="empty">Dukaan lama helin.</div>`}</div>`}
async function ext(id,d){const {error}=await sb.rpc("admin_extend",{p_shop:id,p_days:d});if(error)return toast(error.message);toast(`+${d} maalmood ✓`);load()}
async function susp(id,v){if(v&&!confirm("Ma hubtaa inaad hakiso dukaankan?"))return;const {error}=await sb.rpc("admin_suspend",{p_shop:id,p_suspend:v});if(error)return toast(error.message);load()}
function vHist(){const L=ALLPAY.filter(p=>p.status!=="pending");if(!L.length)return `<div class="card empty">Weli wax lacag-bixin ah lama ansixin.</div>`;
return `<div class="card"><table><tr><th>Taariikh</th><th>Dukaanka</th><th>Muddo</th><th class="num">Lacag</th><th>Tix</th><th>Xaalad</th></tr>${L.map(p=>`<tr><td>${fd(p.created_at)}</td><td>${h(p.shop_name)}</td><td>${p.months} bil</td><td class="num">${m(p.amount)}</td><td class="num">${h(p.ref||p.sender)}</td><td><span class="tag ${p.status==="approved"?"k":"r"}">${p.status==="approved"?"La ansixiyay":"La diiday"}</span>${p.note?`<div class="mu">${h(p.note)}</div>`:""}</td></tr>`).join("")}</table></div>`}
function vSet(){const P=CONF.payment||{},PL=CONF.plans||[];return `<div class="grid2"><div class="card"><h2>Lambarrada lacag-bixinta iyo taageerada</h2><p class="mu" style="margin-bottom:12px">Dukaamadu waxay lacagta u dirayaan lambarradan. Waxay ka muuqdaan app-ka.</p><label>Zaad</label><input id="pz" value="${h(P.zaad||"")}" inputmode="tel"><label>eDahab</label><input id="pe" value="${h(P.edahab||"")}" inputmode="tel"><label>Magaca ka muuqda</label><input id="pn" value="${h(P.name||"DeynDhowr")}"><label>WhatsApp-ka DeynDhowr (taageerada)</label><input id="ps" value="${h(P.support||"")}" inputmode="tel" placeholder="063…"><p class="mu" style="margin:-4px 0 12px">Dukaamadu waxay kugula xidhiidhayaan lambarkan, badhanka "Nala xidhiidh" ee app-ka.</p><button class="btn lg" onclick="savePay()">Kaydi</button></div>
<div class="card"><h2>Qiimayaasha muddaysiga</h2><p class="mu" style="margin-bottom:12px">Muddo (bilood) iyo qiime ($).</p><div id="pl">${PL.map((p,i)=>planRow(p,i)).join("")}</div><button class="btn g" style="margin-bottom:12px" onclick="addPlan()">+ Qorshe kale</button><label>Maalmaha tijaabada bilaashka ah</label><input id="td" type="number" value="${h(CONF.trial_days||14)}"><button class="btn lg" onclick="savePlans()">Kaydi</button></div></div>`}
const planRow=(p,i)=>`<div class="plan"><input type="number" min="1" max="24" value="${p.months}" placeholder="Bilood"><input type="number" step="0.01" value="${p.price}" placeholder="$"><button class="btn d" onclick="this.parentNode.remove()">✕</button></div>`;
function addPlan(){$("#pl").insertAdjacentHTML("beforeend",planRow({months:"",price:""}))}
async function savePay(){const {error}=await sb.rpc("admin_set_setting",{p_key:"payment",p_value:{zaad:$("#pz").value.trim(),edahab:$("#pe").value.trim(),name:$("#pn").value.trim()||"DeynDhowr",support:$("#ps").value.trim()}});if(error)return toast(error.message);toast("Waa la kaydiyay ✓");load()}
async function savePlans(){const pl=[...document.querySelectorAll("#pl .plan")].map(r=>{const [a,b]=r.querySelectorAll("input");return {months:+a.value,price:+b.value}}).filter(p=>p.months>=1&&p.months<=24&&p.price>=0).sort((a,b)=>a.months-b.months);
if(!pl.length)return toast("Ugu yaraan hal qorshe geli");const td=Math.max(0,Math.min(90,+$("#td").value||14));
for(const [k,v] of [["plans",pl],["trial_days",td]]){const {error}=await sb.rpc("admin_set_setting",{p_key:k,p_value:v});if(error)return toast(error.message)}toast("Waa la kaydiyay ✓");load()}
</script></body></html>
